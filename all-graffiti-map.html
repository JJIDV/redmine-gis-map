<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graffiti – vykdomi darbai</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Tik animaciju ir pozicionavimo stiliai.
       MarkerCluster.Default.css nekraunamas, nes spieciu isvaizda aprasyta zemiau. -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/proj4@2.9.1/dist/proj4.js"></script>

  <style>

    /* ===== ID Vilnius tokenai ===== */
    :root {
      --navy: #021d44;
      --navy-900: #011430;
      --royal: #002f77;
      --sky: #00b7f4;
      --green: #2aa00c;
      --silver: #bec7cc;
      --muted: #67778f;
      --muted-hi: #9aa5b4;
      --danger: #ff6b6b;

      --line: rgba(255, 255, 255, 0.10);
      --line-hi: rgba(255, 255, 255, 0.20);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-hi: rgba(255, 255, 255, 0.12);

      --font-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

      --panel-w: 304px;
      --handle-h: 46px;

      /* Fonas po plytelemis, kad kraunantis nemirgetu balti tarpai */
      --map-bg: #f2f2f0;
    }

    [data-basemap="dark"] {
      --map-bg: #101418;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: var(--font-ui);
      background: var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    #map {
      flex: 1;
      min-width: 0;
      background: var(--map-bg);
    }

    /* ===== Panele ===== */
    #panel {
      flex: 0 0 var(--panel-w);
      max-width: var(--panel-w);
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #021d44 0%, #011430 100%);
      color: #fff;
      border-left: 1px solid var(--line);
    }

    /* Ikelimo eigos begis */
    #rail {
      height: 2px;
      flex: 0 0 2px;
      background: var(--line);
      overflow: hidden;
    }

    #rail-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--sky), var(--green));
      transition: width 0.25s ease, opacity 0.4s ease 0.3s;
    }

    #rail[data-state="done"] #rail-fill { opacity: 0; }
    #rail[data-state="error"] #rail-fill { width: 100%; background: var(--danger); opacity: 1; }

    /* ===== Antraste ===== */
    #panel-head {
      flex: 0 0 auto;
      border-bottom: 1px solid var(--line);
    }

    #panel-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 12px 14px;
    }

    #panel-title .name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .count {
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--sky);
      margin-left: auto;
    }

    #sheet-handle {
      display: none;
      width: 100%;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: var(--handle-h);
      background: none;
      border: 0;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    #sheet-grip {
      width: 26px;
      height: 3px;
      border-radius: 999px;
      background: var(--line-hi);
      flex: 0 0 auto;
    }

    #sheet-handle:hover #sheet-grip { background: var(--sky); }

    /* ===== Kunas ===== */
    #panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #filter {
      flex: 0 0 auto;
      margin: 12px 14px 4px;
      padding: 8px 10px;
      width: calc(100% - 28px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }

    #filter::placeholder { color: var(--muted); }

    #filter:focus-visible {
      border-color: var(--sky);
      box-shadow: 0 0 0 2px rgba(0, 183, 244, 0.28);
    }

    /* ===== Legenda kaip filtras ===== */
    #keys-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 4px;
    }

    #keys-bar .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-hi);
    }

    #keys-toggle {
      margin-left: auto;
      background: none;
      border: 0;
      color: var(--muted-hi);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    #keys-toggle:hover { color: #fff; background: var(--surface); }

    #keys {
      /* flex-shrink privalo buti 0, kitaip sarasas suspaudzia filtrus
         iki juosteles ir ju nebeimanoma isskleisti. */
      flex: 0 0 auto;
      max-height: 40vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 14px 8px;
    }

    #panel.keys-collapsed #keys { display: none; }

    .key-group + .key-group { margin-top: 10px; }

    .key-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 6px 0 6px;
    }

    .key-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .key-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .key-actions button {
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted-hi);
      font-family: inherit;
      font-size: 10px;
      padding: 2px 7px;
      cursor: pointer;
    }

    .key-actions button:hover {
      color: #fff;
      border-color: var(--line-hi);
      background: var(--surface);
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px 4px 7px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    .pill:hover { background: var(--surface); color: var(--muted-hi); }

    .pill .dot { opacity: 0.45; }

    .pill[aria-pressed="true"] {
      background: var(--surface-hi);
      border-color: var(--line-hi);
      color: #fff;
    }

    .pill[aria-pressed="true"] .dot { opacity: 1; }

    .pill-count {
      font-family: var(--font-mono);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .pill[aria-pressed="true"] .pill-count { color: var(--sky); }

    /* Skrituliai: uzpildytas = statusas, konturinis = imone */
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .dot.ring {
      background: transparent;
      border: 2px solid currentColor;
    }

    /* ===== Sarasas ===== */
    #list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-top: 1px solid var(--line);
    }

    .feature-row {
      position: relative;
      padding: 8px 12px 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .feature-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--company-color, var(--muted));
    }

    .feature-row:hover { background: rgba(0, 183, 244, 0.08); }

    .feature-row.active { background: rgba(0, 183, 244, 0.16); }

    .feature-row.active::before { background: var(--sky); }

    .feature-row:focus-visible {
      outline: 2px solid var(--sky);
      outline-offset: -2px;
    }

    .row-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .row-id {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .row-geom {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .row-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted-hi);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #list-empty {
      padding: 18px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted-hi);
    }

    #list-empty strong {
      display: block;
      color: #fff;
      font-weight: 600;
      margin-bottom: 3px;
    }

    /* ===== Slankikliai ===== */

    #list,
    #keys {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.20) transparent;
    }

    #list::-webkit-scrollbar,
    #keys::-webkit-scrollbar {
      width: 10px;
    }

    #list::-webkit-scrollbar-track,
    #keys::-webkit-scrollbar-track {
      background: transparent;
    }

    #list::-webkit-scrollbar-thumb,
    #keys::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }

    #list::-webkit-scrollbar-thumb:hover,
    #keys::-webkit-scrollbar-thumb:hover {
      background-color: rgba(0, 183, 244, 0.55);
    }

    /* Rodykles slankiklio galuose pasalinamos */
    #list::-webkit-scrollbar-button,
    #keys::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    #list::-webkit-scrollbar-corner,
    #keys::-webkit-scrollbar-corner {
      background: transparent;
    }

    /* ===== Poraste ===== */
    #status-bar {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      line-height: 1.45;
      color: var(--muted-hi);
      word-break: break-word;
    }

    #status-bar .num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    #status-bar.is-error {
      color: var(--danger);
      background: rgba(255, 107, 107, 0.08);
    }

    /* ===== Leaflet perdazymas ===== */
    .leaflet-container {
      font-family: var(--font-ui);
      background: var(--map-bg);
    }

    .leaflet-control-zoom a {
      background: #fff;
      color: var(--navy);
      border-color: var(--silver);
      font-weight: 600;
    }

    .leaflet-control-zoom a:hover { background: #f5f5f5; color: var(--royal); }

    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.86);
      color: #4a5568;
      font-size: 10px;
    }

    .leaflet-control-attribution a { color: var(--royal); }

    [data-basemap="dark"] .leaflet-control-zoom a {
      background: #1a2230;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.16);
    }

    [data-basemap="dark"] .leaflet-control-zoom a:hover {
      background: #24303f;
      color: var(--sky);
    }

    [data-basemap="dark"] .leaflet-control-attribution {
      background: rgba(10, 14, 20, 0.78);
      color: var(--muted-hi);
    }

    [data-basemap="dark"] .leaflet-control-attribution a { color: var(--sky); }

    .leaflet-popup-content-wrapper {
      background: var(--navy);
      color: #fff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(1, 20, 48, 0.35);
    }

    .leaflet-popup-tip { background: var(--navy); }

    .leaflet-popup-content {
      margin: 11px 13px;
      font-size: 12px;
      line-height: 1.55;
    }

    .leaflet-popup-close-button { color: var(--muted-hi) !important; }
    .leaflet-popup-close-button:hover { color: #fff !important; }

    .pop-id {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .pop-line {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted-hi);
    }

    .pop-line b {
      color: #fff;
      font-weight: 500;
    }

    .pop-pick-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-hi);
      margin-bottom: 4px;
    }

    .overlap-select-item {
      padding: 7px 4px;
      cursor: pointer;
      border-top: 1px solid var(--line);
    }

    .overlap-select-item:hover { background: var(--surface); }

    /* ===== Nuoroda i Redmine uzduoti popup viduje =====
       Selektorius su .leaflet-popup-content, nes Leaflet turi savo
       .leaflet-container a spalva, kuri kitaip nugaletu. */
    .leaflet-popup-content .pop-action {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      padding: 6px 11px;
      border-radius: 6px;
      background: rgba(0, 183, 244, 0.14);
      border: 1px solid rgba(0, 183, 244, 0.38);
      color: var(--sky);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .leaflet-popup-content .pop-action:hover,
    .leaflet-popup-content .pop-action:focus-visible {
      background: rgba(0, 183, 244, 0.26);
      border-color: var(--sky);
      color: #fff;
      outline: none;
    }

    .leaflet-popup-content .pop-action svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .pop-note {
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
    }

    /* ===== Taskai ir spieciai ================================== */

    .idv-dot {
      background: transparent;
      border: 0;
    }

    .idv-dot-inner {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .idv-cluster {
      background: transparent;
      border: 0;
    }

    .idv-cluster-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      color: #fff;
      font-family: var(--font-mono);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      /* Balta aureole atskiria spieciu nuo sviesaus pagrindo.
         Tai valdiklio, o ne duomenu tasko elementas. */
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.6),
        0 2px 10px rgba(1, 20, 48, 0.28);
    }

    .idv-cluster-inner.size-s { font-size: 11px; }
    .idv-cluster-inner.size-m { font-size: 12px; }
    .idv-cluster-inner.size-l { font-size: 13px; }

    .leaflet-marker-icon.idv-cluster:hover .idv-cluster-inner {
      box-shadow:
        0 0 0 4px rgba(0, 183, 244, 0.45),
        0 2px 10px rgba(1, 20, 48, 0.32);
    }

    /* ===== Kompaktinis rezimas: zemas iframe arba mobilus ===== */
    @media (max-width: 640px), (max-height: 520px) {
      #app {
        display: block;
        position: relative;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      #panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1100;
        flex: none;
        max-width: none;
        max-height: 78%;
        border-left: 0;
        border-top: 1px solid var(--line-hi);
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -10px 30px rgba(1, 20, 48, 0.40);
      }

      #rail { border-radius: 12px 12px 0 0; }

      #panel-head { border-bottom: 0; }
      #panel-title { display: none; }
      #sheet-handle { display: flex; }

      #panel-body { display: none; }
      #panel.open #panel-body { display: flex; }
      #panel.open #panel-head { border-bottom: 1px solid var(--line); }

      #panel:not(.open) #status-bar { display: none; }

      #keys { max-height: 32vh; }

      .leaflet-bottom.leaflet-right { bottom: calc(var(--handle-h) + 4px); }
    }

    /* ===== Platus ir zemas langas ==============================
       Kai aukstis yra 300 px arba maziau, o plotis didesnis negu 1200 px,
       apatinis lapas butu aukstesnis uz pati zemelapi, todel panele
       grazinama i desini sona.

       Blokas eina PO kompaktinio rezimo, todel esant vienodam
       specifiskumui laimi sios taisykles.
       ========================================================= */
    @media (min-width: 1201px) and (max-height: 300px) {
      #app {
        display: flex;
        position: static;
      }

      #map {
        position: static;
        inset: auto;
        flex: 1;
        min-width: 0;
      }

      #panel {
        /* Esant tokiam plociui panele gali buti kiek platesne,
           kad adresai ir rangovu pavadinimai netilptu i viena eilute reciau. */
        --panel-w: 330px;

        position: static;
        flex: 0 0 var(--panel-w);
        max-width: var(--panel-w);
        max-height: none;
        z-index: auto;
        border-left: 1px solid var(--line);
        border-top: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #rail { border-radius: 0; }

      #panel-head { border-bottom: 1px solid var(--line); }
      #panel-title { display: flex; padding: 9px 14px; }
      #sheet-handle { display: none; }

      #panel-body { display: flex; }
      #panel:not(.open) #status-bar { display: block; }

      #filter { margin: 9px 14px 4px; }
      #keys-bar { padding: 6px 14px 4px; }

      /* Prie 300 px aukscio filtrams paliekama maziau vietos,
         kad sarasui liektu bent kelios eilutes. */
      #keys { max-height: 34vh; }

      .leaflet-bottom.leaflet-right { bottom: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    /* ===== Graficiu saraso eilutes ========================================= */

    .row-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .row-coords {
      font-family: var(--font-mono);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
    }

    #status-bar .sep {
      color: var(--muted);
      padding: 0 2px;
    }

    /* Redmine uzduoties numeris koordinaciu eiluteje.
       Sky spalva cia nenaudojama samoningai - ji rezervuota tik tam,
       kas tikrai paspaudziama. */
    .row-issue {
      color: var(--muted-hi);
      margin-right: 7px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="map"></div>

    <aside id="panel" class="keys-collapsed">
      <div id="rail"><div id="rail-fill"></div></div>

      <header id="panel-head">
        <button id="sheet-handle" type="button" aria-expanded="false" aria-controls="panel-body">
          <span id="sheet-grip"></span>
          <span id="sheet-label">Objektų sąrašas</span>
          <span id="count-compact" class="count">–</span>
        </button>

        <div id="panel-title">
          <span class="name">Vykdomi darbai</span>
          <span id="count-wide" class="count">–</span>
        </div>
      </header>

      <div id="panel-body">
        <input
          id="filter"
          type="text"
          placeholder="Ieškoti pagal adresą, rangovą ar tipą"
          aria-label="Ieškoti objektų"
        />

        <div id="keys-bar">
          <span class="label">Ką rodyti</span>
          <button id="keys-toggle" type="button" aria-expanded="false" aria-controls="keys">
            Rodyti filtrus
          </button>
        </div>

        <div id="keys">
          <div class="key-group" id="type-group"></div>
          <div class="key-group" id="contractor-group"></div>
        </div>

        <div id="list"></div>
      </div>

      <footer id="status-bar">Kraunami duomenys</footer>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    /* =========================================================
       BAZINIS ZEMELAPIS
       Visi variantai nemokami, be API rakto, teikiami per CDN.
       Perjungiama viena eilute: const BASEMAP = BASEMAPS.<vardas>;
       ========================================================= */
    const CARTO_ATTRIBUTION =
      '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ' +
      '© <a href="https://carto.com/attributions">CARTO</a>';

    const BASEMAPS = {
      positron: {
        tone: "light",
        url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      },
      positronNoLabels: {
        tone: "light",
        url: "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      },
      darkMatter: {
        tone: "dark",
        url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      },
      darkMatterNoLabels: {
        tone: "dark",
        url: "https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      }
    };

    const BASEMAP = BASEMAPS.positron;

    /* =========================================================
       SERVISO KONFIGURACIJA
       ========================================================= */
    const arcgisLayerUrl =
      "https://opencity.idvilnius.lt/atviras/rest/services/Miesto_tvark/Grafiti_view_Public/MapServer/0";

    /* Sluoksnis yra Table be geometrijos, todel returnGeometry visada false,
       o taskai konstruojami is X_koord ir Y_koord. */
    const whereClause = "statusas_name = 'Vykdoma (Rangovai)'";

    /* Tekstas porasteje. Turi atitikti whereClause. */
    const FILTER_LABEL = "Vykdoma (Rangovai)";

    /* Serviso vaizdas vadinasi query_layer_2metai. */
    const PERIOD_LABEL = "paskutiniai 2 metai";

    const outFieldsList =
      "OBJECTID,tvark_tipas_name,statusas_name,adresas,rangovas,X_koord,Y_koord,redmine_url";

    /* Sluoksnio MaxRecordCount = 2000 */
    const pageSize = 2000;
    const maxPages = 25;

    /* Serviso Spatial Reference yra 3346 (LKS94, metrai). */
    const KOORD_WKID = 3346;

    /* =========================================================
       REDMINE NUORODA

       Serviso laukas redmine_url yra tekstinis (length 255) ir jame
       laikomas tik uzduoties numeris, pvz. 4159. Pilnas adresas
       sudaromas is sablono zemiau.
       ========================================================= */

    const REDMINE_ISSUE_BASE = "https://redmine.idvilnius.lt/issues/";

    /* "_blank" atidaro nauja skirtuka, o zemelapis lieka atidarytas.
       "_top" perkelia visa narsykles skirtuka - tai naudinga, kai
       zemelapis iterptas per {{iframe(...)}} ir norima iseiti is iframe. */
    const REDMINE_LINK_TARGET = "_blank";

    /* Mygtuko tekstas popup viduje. */
    const LABEL_OPEN_ISSUE = "Atverti užduotį";

    /* =========================================================
       SPALVOS
       Uzpildas koduoja tvarkymo tipa, konturas - rangova.
       Ta pati logika kaip EOP zemelapiuose.
       ========================================================= */

    /* Tasku uzpildo spalva pagal rangova.
       Atitikmuo ieskomas pagal fragmenta mazosiomis raidemis, todel veikia
       nepriklausomai nuo to, ar reiksmeje yra UAB, kabutes ar inicialai
       (pvz. UAB "D. Varec" ir D. Varec duos ta pacia spalva).
       Spalvos parinktos skirtingo atspalvio ir sviesumo, kad skirtusi
       ir esant spalvu skyrimo sutrikimams. */
    const contractorColorRules = [
      { match: "varec", color: "#0046aa" },
      { match: "dezinfek", color: "#e8590c" },
      { match: "socialin", color: "#40c057" }
    ];

    /* Tasku isvaizda. Kontruro nera.
       Noredami ji grazinti, irasykite spalva, pvz. "#ffffff". */
    const MARKER_SIZE = 12;
    const MARKER_OPACITY = 0.85;
    const MARKER_STROKE_COLOR = null;

    /* =========================================================
       SPIECIAI
       ========================================================= */

    const CLUSTER_ENABLED = true;

    /* Apytikslis pradinis miesto mastelis. Nuo jo skaiciuojami zingsniai. */
    const CLUSTER_BASE_ZOOM = 11;

    /* Po keliu priartinimo zingsniu spieciai isjungiami visai. */
    const CLUSTER_ZOOM_STEPS = 4;
    const CLUSTER_OFF_ZOOM = CLUSTER_BASE_ZOOM + CLUSTER_ZOOM_STEPS;

    /* Grupavimo spindulys pikseliais. Mazeja priartinant,
       todel spieciai palaipsniui skyla i smulkesnius. */
    const CLUSTER_MAX_RADIUS = 80;
    const CLUSTER_MIN_RADIUS = 28;

    /* Spieciaus spalva, kai jame yra daugiau negu vieno rangovo objektu. */
    const CLUSTER_MIXED_COLOR = "#021d44";

    /* Mastelis, iki kurio priartinama pasirinkus objekta sarase. */
    const FOCUS_ZOOM = 18;

    /* GRAFITI_STAT domenas. Statusas 8 dokumentacijoje sutinkamas
       dviem rasybomis, todel irasytos abi. */
    const statusColors = {
      "Užfiksuota (VMS)": "#67778f",
      "Patvirtinta (VMS)": "#0070d9",
      "Vykdoma (Rangovai)": "#f59e0b",
      "Atlikta (Rangovai)": "#86efac",
      "Užbaigta (VMS)": "#2aa00c",
      "Atmesta (Rangovai)": "#dc2626",
      "Atšaukta (VMS)": "#67778f",
      "Gražinta (VMS)": "#facc15",
      "Grąžinta (VMS)": "#facc15"
    };

    const DEFAULT_STATUS_COLOR = "#bec7cc";

    /* Rangovu sarasas is anksto nezinomas, todel spalvos priskiriamos
       is fiksuotos paletes pagal abecele. Kol rangovu rinkinys nesikeicia,
       spalvos islieka tos pacios. */
    const contractorPalette = [
      "#1f78b4",
      "#33a02c",
      "#e31a1c",
      "#ff7f00",
      "#6a3d9a",
      "#b15928",
      "#17a2b8",
      "#c2185b"
    ];

    const DEFAULT_CONTRACTOR_COLOR = "#6b7280";

    let contractorColors = {};

    /* =========================================================
       PAGALBINES FUNKCIJOS
       ========================================================= */

    proj4.defs(
      "EPSG:3346",
      "+proj=tmerc +lat_0=0 +lon_0=24 +k=0.9998 +x_0=500000 +y_0=0 +ellps=GRS80 +units=m +no_defs"
    );

    function lksToWgs(x, y) {
      const result = proj4("EPSG:" + KOORD_WKID, "EPSG:4326", [x, y]);
      return [result[1], result[0]];
    }

    function esc(value) {
      return String(value === null || value === undefined ? "" : value).replace(
        /[&<>"']/g,
        function (ch) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[ch];
        }
      );
    }

    function normalizeText(value) {
      if (value === null || value === undefined) return "";
      return String(value).trim();
    }

    function getTypeText(value) {
      const text = normalizeText(value);
      return text || "Nenurodytas tipas";
    }

    function getStatusText(value) {
      const text = normalizeText(value);
      return text || "Nenurodytas statusas";
    }

    function getStatusColor(value) {
      const text = normalizeText(value);
      return statusColors[text] || DEFAULT_STATUS_COLOR;
    }

    function getContractorText(value) {
      const text = normalizeText(value);
      return text || "Nenurodytas rangovas";
    }

    function getContractorColor(key) {
      return contractorColors[key] || DEFAULT_CONTRACTOR_COLOR;
    }

    /* Grazina { id, url } arba null.

       Laukas yra tekstinis, todel apdorojami trys atvejai:
         - tuscias arba NULL           -> null
         - pilnas adresas su http      -> naudojamas kaip yra
         - numeris, galimai su tarpais -> paliekami tik skaitmenys

       Skaitmenu filtras yra svarbus: be jo tarpas arba bruksnelis
       patektu i adresa ir nuoroda nuluztu. */
    function redmineIssue(rawValue) {
      const text = normalizeText(rawValue);
      if (!text) return null;

      if (/^https?:\/\//i.test(text)) {
        const fromUrl = text.match(/\/issues\/(\d+)/);
        return { id: fromUrl ? fromUrl[1] : null, url: text };
      }

      const digits = text.replace(/\D+/g, "");
      if (!digits) return null;

      return { id: digits, url: REDMINE_ISSUE_BASE + digits };
    }

    /* Isorines nuorodos ikona ta pacia linijine maniera kaip zemelapio smeigtukas */
    function externalLinkSvg() {
      return (
        '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path d="M14 4h6v6"/>' +
        '<path d="M20 4l-8.5 8.5"/>' +
        '<path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7.5A1.5 1.5 0 0 1 5 6h4.5"/>' +
        "</svg>"
      );
    }

    function assignContractorColors(keys) {
      const unique = [];

      keys.forEach(function (key) {
        if (unique.indexOf(key) === -1) unique.push(key);
      });

      unique.sort(function (a, b) {
        return String(a).localeCompare(String(b), "lt");
      });

      contractorColors = {};
      let paletteIndex = 0;

      unique.forEach(function (key) {
        const lower = String(key).toLowerCase();
        let matched = null;

        for (let i = 0; i < contractorColorRules.length; i++) {
          if (lower.indexOf(contractorColorRules[i].match) !== -1) {
            matched = contractorColorRules[i].color;
            break;
          }
        }

        if (matched) {
          contractorColors[key] = matched;
          return;
        }

        contractorColors[key] = contractorPalette[paletteIndex % contractorPalette.length];
        paletteIndex++;

        console.warn(
          '[grafiti] rangovui "' + key + '" nėra spalvos taisyklės, priskirta iš atsarginės paletės'
        );
      });
    }

    /* =========================================================
       ZEMELAPIS
       ========================================================= */

    document.documentElement.setAttribute("data-basemap", BASEMAP.tone);

    const map = L.map("map", { zoomControl: true }).setView([54.687, 25.28], 11);

    L.tileLayer(BASEMAP.url, {
      subdomains: "abcd",
      maxZoom: 20,
      detectRetina: true,
      crossOrigin: true,
      attribution: BASEMAP.attribution
    }).addTo(map);

    /* ===== DOM ===== */
    const panelEl = document.getElementById("panel");
    const listEl = document.getElementById("list");
    const filterInput = document.getElementById("filter");
    const typeGroupEl = document.getElementById("type-group");
    const contractorGroupEl = document.getElementById("contractor-group");
    const keysToggle = document.getElementById("keys-toggle");
    const sheetHandle = document.getElementById("sheet-handle");
    const sheetLabel = document.getElementById("sheet-label");
    const statusBar = document.getElementById("status-bar");
    const countWide = document.getElementById("count-wide");
    const countCompact = document.getElementById("count-compact");
    const railEl = document.getElementById("rail");
    const railFill = document.getElementById("rail-fill");

    let allItems = [];
    let featureLayer = createMarkerGroup();

    function clusterRadiusForZoom(zoom) {
      const span = Math.max(CLUSTER_ZOOM_STEPS, 1);
      const step = Math.min(Math.max(zoom - CLUSTER_BASE_ZOOM, 0), span);
      const range = CLUSTER_MAX_RADIUS - CLUSTER_MIN_RADIUS;

      return Math.round(CLUSTER_MAX_RADIUS - range * (step / span));
    }

    function clusterIcon(cluster) {
      const count = cluster.getChildCount();
      const children = cluster.getAllChildMarkers();

      let color = null;
      let mixed = false;

      for (let i = 0; i < children.length; i++) {
        const childColor = children[i].options.idvColor;

        if (color === null) {
          color = childColor;
        } else if (color !== childColor) {
          mixed = true;
          break;
        }
      }

      const fill = mixed || !color ? CLUSTER_MIXED_COLOR : color;

      let size = 30;
      let sizeClass = "size-s";

      if (count >= 200) {
        size = 52;
        sizeClass = "size-l";
      } else if (count >= 50) {
        size = 44;
        sizeClass = "size-m";
      } else if (count >= 10) {
        size = 36;
        sizeClass = "size-m";
      }

      return L.divIcon({
        className: "idv-cluster",
        html:
          '<div class="idv-cluster-inner ' + sizeClass +
          '" style="background:' + fill + '">' + count + "</div>",
        iconSize: L.point(size, size),
        iconAnchor: L.point(size / 2, size / 2)
      });
    }

    function createMarkerGroup() {
      if (CLUSTER_ENABLED && typeof L.markerClusterGroup === "function") {
        return L.markerClusterGroup({
          maxClusterRadius: clusterRadiusForZoom,
          disableClusteringAtZoom: CLUSTER_OFF_ZOOM,
          spiderfyOnMaxZoom: false,
          showCoverageOnHover: false,
          zoomToBoundsOnClick: true,
          chunkedLoading: true,
          animateAddingMarkers: false,
          iconCreateFunction: clusterIcon
        }).addTo(map);
      }

      if (CLUSTER_ENABLED) {
        console.warn("[grafiti] Leaflet.markercluster neįsikėlė, spiečiai išjungti");
      }

      return L.featureGroup().addTo(map);
    }

    function dotIcon(color) {
      const ring = MARKER_STROKE_COLOR
        ? ";box-shadow:0 0 0 1.5px " + MARKER_STROKE_COLOR
        : "";

      return L.divIcon({
        className: "idv-dot",
        html:
          '<span class="idv-dot-inner" style="background:' + color +
          ";opacity:" + MARKER_OPACITY + ring + '"></span>',
        iconSize: L.point(MARKER_SIZE, MARKER_SIZE),
        iconAnchor: L.point(MARKER_SIZE / 2, MARKER_SIZE / 2),
        popupAnchor: L.point(0, -MARKER_SIZE / 2)
      });
    }
    let selectedTypes = new Set();
    let selectedContractors = new Set();
    let typeKeys = [];
    let contractorKeys = [];

    /* Kompaktiniame rezime panele yra virs zemelapio. */
    L.DomEvent.disableClickPropagation(panelEl);
    L.DomEvent.disableScrollPropagation(panelEl);

    function refreshMapSize() {
      setTimeout(function () {
        map.invalidateSize();
      }, 60);
    }

    /* ===== Eigos begis ===== */
    function setProgress(loaded, total) {
      railEl.removeAttribute("data-state");
      const pct = total > 0 ? Math.round((loaded / total) * 100) : 0;
      railFill.style.width = pct + "%";
    }

    function finishProgress(state) {
      railFill.style.width = "100%";
      railEl.setAttribute("data-state", state);
    }

    function setStatus(html, isError) {
      statusBar.innerHTML = html;
      statusBar.classList.toggle("is-error", !!isError);
    }

    function setCounts(shown) {
      const text = String(shown);
      countWide.textContent = text;
      countCompact.textContent = text;
    }

    /* =========================================================
       UZKLAUSOS
       ========================================================= */

    function queryUrl(params) {
      const url =
        arcgisLayerUrl.replace(/\/+$/, "") + "/query?" + new URLSearchParams(params).toString();
      console.log("Query URL:", url);
      return url;
    }

    /* Tikrinamas ir HTTP statusas, ir ArcGIS klaidos objektas.
       ArcGIS klaida daznai grazina su HTTP 200, todel be sio patikrinimo
       klaida atrodytu kaip tuscias rezultatas. */
    async function fetchJson(url) {
      const resp = await fetch(url, { cache: "no-store", mode: "cors" });

      if (!resp.ok) {
        throw new Error("HTTP " + resp.status + " " + (resp.statusText || ""));
      }

      const data = await resp.json();

      if (data && data.error) {
        const details = Array.isArray(data.error.details)
          ? data.error.details.join("; ")
          : "";
        throw new Error(
          "ArcGIS " + data.error.code + ": " + data.error.message +
          (details ? " (" + details + ")" : "")
        );
      }

      return data;
    }

    async function fetchCount() {
      const data = await fetchJson(
        queryUrl({
          where: whereClause,
          returnGeometry: "false",
          returnCountOnly: "true",
          f: "json"
        })
      );

      return typeof data.count === "number" ? data.count : null;
    }

    async function fetchAllFeatures(total) {
      const collected = [];
      let offset = 0;

      for (let page = 0; page < maxPages; page++) {
        const data = await fetchJson(
          queryUrl({
            where: whereClause,
            outFields: outFieldsList,
            returnGeometry: "false",
            resultOffset: String(offset),
            resultRecordCount: String(pageSize),
            f: "json"
          })
        );

        const batch = Array.isArray(data.features) ? data.features : [];
        collected.push.apply(collected, batch);

        setProgress(collected.length, total || collected.length + pageSize);

        if (!data.exceededTransferLimit || batch.length === 0) break;
        offset += batch.length;
      }

      return collected;
    }

    /* Kai filtras nieko neranda, parodomos realios servise esancios reiksmes. */
    async function showStatusDiagnostics() {
      try {
        const data = await fetchJson(
          queryUrl({
            where: "1=1",
            outFields: "statusas_name",
            returnDistinctValues: "true",
            returnGeometry: "false",
            f: "json"
          })
        );

        const features = Array.isArray(data.features) ? data.features : [];
        const values = features
          .map(function (f) { return (f.attributes || {}).statusas_name; })
          .filter(function (v) { return v !== null && v !== undefined && v !== ""; });

        console.warn("statusas_name reikšmės servise:", values);

        if (!values.length) {
          setStatus("Servise nėra įrašų", true);
        } else {
          setStatus(
            "Pagal filtrą <b>" + esc(FILTER_LABEL) + "</b> įrašų nėra. Servise yra: " +
            esc(values.join(" | ")),
            true
          );
        }
      } catch (e) {
        console.error(e);
        setStatus("Nerasta objektų. Diagnostika nepavyko: " + esc(e.message), true);
      }
    }

    /* =========================================================
       SARASAS IR FILTRAI
       ========================================================= */

    function clearActiveRows() {
      document.querySelectorAll(".feature-row.active").forEach(function (el) {
        el.classList.remove("active");
      });
    }

    function renderList(items) {
      listEl.innerHTML = "";

      if (!items.length) {
        const empty = document.createElement("div");
        empty.id = "list-empty";
        empty.innerHTML =
          "<strong>Nieko nerodoma</strong>" +
          "Įjunkite bent vieną darbo tipą ir rangovą arba išvalykite paieškos tekstą.";
        listEl.appendChild(empty);
        return;
      }

      items.forEach(function (item) {
        listEl.appendChild(item.rowEl);
      });
    }

    function getVisibleItems() {
      const q = filterInput.value.trim().toLowerCase();

      return allItems.filter(function (item) {
        if (!selectedTypes.has(item.typeKey)) return false;
        if (!selectedContractors.has(item.contractorKey)) return false;
        if (!q) return true;

        return (item.searchText || "").toLowerCase().includes(q);
      });
    }

    function applyFilter() {
      featureLayer.clearLayers();

      const visibleItems = getVisibleItems();
      const layers = visibleItems.map(function (item) {
        return item.layer;
      });

      /* addLayers yra markercluster metodas ir prideda viska vienu kartu.
         Prie 500+ objektu tai daug greitesnis budas negu po viena. */
      if (typeof featureLayer.addLayers === "function") {
        featureLayer.addLayers(layers);
      } else {
        layers.forEach(function (layer) {
          featureLayer.addLayer(layer);
        });
      }

      renderList(visibleItems);
      setCounts(visibleItems.length);

      setStatus(
        '<span class="num">' + visibleItems.length + "</span> iš " +
        '<span class="num">' + allItems.length + "</span> objektų" +
        '<span class="sep"> · </span>' + esc(FILTER_LABEL) +
        '<span class="sep"> · </span>' + esc(PERIOD_LABEL)
      );

      sheetLabel.textContent = visibleItems.length ? "Objektų sąrašas" : "Nieko nerodoma";
    }

    function makePill(swatchClass, color, name, count, isOn, onToggle) {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "pill";
      pill.setAttribute("aria-pressed", isOn ? "true" : "false");

      if (swatchClass) {
        const dot = document.createElement("span");
        dot.className = "dot " + swatchClass;

        if (swatchClass === "ring") {
          dot.style.color = color;
        } else {
          dot.style.background = color;
        }

        pill.appendChild(dot);
      }

      const nameEl = document.createElement("span");
      nameEl.className = "pill-name";
      nameEl.textContent = name;

      const countEl = document.createElement("span");
      countEl.className = "pill-count";
      countEl.textContent = count;

      pill.appendChild(nameEl);
      pill.appendChild(countEl);

      pill.addEventListener("click", function () {
        const next = pill.getAttribute("aria-pressed") !== "true";
        pill.setAttribute("aria-pressed", next ? "true" : "false");
        onToggle(next);
        applyFilter();
      });

      return pill;
    }

    function makeGroup(container, title, actions) {
      container.innerHTML = "";

      const head = document.createElement("div");
      head.className = "key-head";

      const titleEl = document.createElement("span");
      titleEl.className = "key-title";
      titleEl.textContent = title;
      head.appendChild(titleEl);

      const actionsEl = document.createElement("div");
      actionsEl.className = "key-actions";

      actions.forEach(function (action) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = action.label;
        btn.addEventListener("click", action.run);
        actionsEl.appendChild(btn);
      });

      head.appendChild(actionsEl);
      container.appendChild(head);

      const pills = document.createElement("div");
      pills.className = "pills";
      container.appendChild(pills);

      return pills;
    }

    function countBy(getKey) {
      const counts = {};
      const order = [];

      allItems.forEach(function (item) {
        const key = getKey(item);

        if (counts[key] === undefined) {
          counts[key] = 0;
          order.push(key);
        }

        counts[key]++;
      });

      return { counts: counts, keys: order };
    }

    function buildTypeFilters() {
      const result = countBy(function (item) {
        return item.typeKey;
      });

      typeKeys = result.keys.slice().sort(function (a, b) {
        return String(a).localeCompare(String(b), "lt");
      });

      const pills = makeGroup(typeGroupEl, "Darbo tipas", [
        {
          label: "Visi",
          run: function () {
            selectedTypes = new Set(typeKeys);
            buildTypeFilters();
            applyFilter();
          }
        },
        {
          label: "Nė vieno",
          run: function () {
            selectedTypes = new Set();
            buildTypeFilters();
            applyFilter();
          }
        }
      ]);

      if (!typeKeys.length) {
        const note = document.createElement("div");
        note.className = "pill-count";
        note.textContent = "Tipų nerasta";
        pills.appendChild(note);
        return;
      }

      typeKeys.forEach(function (key) {
        pills.appendChild(
          makePill(
            null,
            null,
            getTypeText(key),
            result.counts[key],
            selectedTypes.has(key),
            function (isOn) {
              if (isOn) {
                selectedTypes.add(key);
              } else {
                selectedTypes.delete(key);
              }
            }
          )
        );
      });
    }

    function buildContractorFilters() {
      const result = countBy(function (item) {
        return item.contractorKey;
      });

      contractorKeys = result.keys.slice().sort(function (a, b) {
        return String(a).localeCompare(String(b), "lt");
      });

      const pills = makeGroup(contractorGroupEl, "Rangovas", [
        {
          label: "Visi",
          run: function () {
            selectedContractors = new Set(contractorKeys);
            buildContractorFilters();
            applyFilter();
          }
        },
        {
          label: "Nė vieno",
          run: function () {
            selectedContractors = new Set();
            buildContractorFilters();
            applyFilter();
          }
        }
      ]);

      if (!contractorKeys.length) {
        const note = document.createElement("div");
        note.className = "pill-count";
        note.textContent = "Rangovų nerasta";
        pills.appendChild(note);
        return;
      }

      contractorKeys.forEach(function (key) {
        pills.appendChild(
          makePill(
            "fill",
            getContractorColor(key),
            getContractorText(key),
            result.counts[key],
            selectedContractors.has(key),
            function (isOn) {
              if (isOn) {
                selectedContractors.add(key);
              } else {
                selectedContractors.delete(key);
              }
            }
          )
        );
      });
    }

    /* =========================================================
       PAZYMEJIMAS
       ========================================================= */

    function itemPopupHtml(item) {
      return (
        '<div class="pop-id">' + esc(item.adresas || "Adresas nenurodytas") + "</div>" +
        '<div class="pop-line">' +
          '<span class="dot fill" style="background:' + esc(item.contractorColor) + '"></span>' +
          "<b>" + esc(item.contractorText) + "</b>" +
        "</div>" +
        '<div class="pop-line">' + esc(item.typeText) + "</div>" +
        '<div class="pop-line">' +
          '<span class="dot fill" style="background:' + esc(getStatusColor(item.statusText)) + '"></span>' +
          esc(item.statusText) +
        "</div>" +
        '<div class="pop-line" style="font-family:var(--font-mono);font-size:11px">' +
          item.lat.toFixed(5) + ", " + item.lon.toFixed(5) +
        "</div>" +
        popupActionHtml(item)
      );
    }

    function popupActionHtml(item) {
      if (!item.redmine) {
        return '<div class="pop-note">Redmine užduotis nenurodyta</div>';
      }

      /* Uzduoties numeris paliekamas title atribute: pasiekiamas
         uzvedus, bet mygtuko teksto neapkrauna. */
      const hint = item.redmine.id ? ' title="#' + esc(item.redmine.id) + '"' : "";

      return (
        '<a class="pop-action" href="' + esc(item.redmine.url) + '"' +
        ' target="' + esc(REDMINE_LINK_TARGET) + '"' +
        ' rel="noopener noreferrer"' + hint + '>' +
        externalLinkSvg() +
        "<span>" + LABEL_OPEN_ISSUE + "</span>" +
        "</a>"
      );
    }

    function focusItem(item) {
      map.setView([item.lat, item.lon], FOCUS_ZOOM);

      /* Atskiras popup, o ne zymeklio popup: pasirinktas objektas gali buti
         spieciuje ir tuo momentu dar nebuti pridetas prie zemelapio. */
      L.popup()
        .setLatLng([item.lat, item.lon])
        .setContent(itemPopupHtml(item))
        .openOn(map);

      clearActiveRows();
      item.rowEl.classList.add("active");
      item.rowEl.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    /* =========================================================
       PANELES VALDYMAS
       ========================================================= */

    sheetHandle.addEventListener("click", function () {
      const isOpen = panelEl.classList.toggle("open");
      sheetHandle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      refreshMapSize();
    });

    keysToggle.addEventListener("click", function () {
      const isCollapsed = panelEl.classList.toggle("keys-collapsed");
      keysToggle.textContent = isCollapsed ? "Rodyti filtrus" : "Slėpti filtrus";
      keysToggle.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
      refreshMapSize();
    });

    filterInput.addEventListener("input", applyFilter);

    /* =========================================================
       DUOMENU IKELIMAS
       ========================================================= */

    async function loadData() {
      try {
        setStatus("Kraunami duomenys");
        setCounts("–");
        setProgress(0, 1);

        featureLayer.clearLayers();
        allItems = [];
        listEl.innerHTML = "";
        typeGroupEl.innerHTML = "";
        contractorGroupEl.innerHTML = "";

        const total = await fetchCount();

        if (total === 0) {
          finishProgress("error");
          setCounts(0);
          renderList([]);
          await showStatusDiagnostics();
          return;
        }

        const features = await fetchAllFeatures(total);

        console.log("Features kiekis:", features.length, "serviso count:", total);

        if (!features.length) {
          finishProgress("error");
          setCounts(0);
          renderList([]);
          await showStatusDiagnostics();
          return;
        }

        let skippedNoCoords = 0;

        const prepared = [];

        features.forEach(function (f) {
          const a = f.attributes || {};

          const x = Number(a.X_koord);
          const y = Number(a.Y_koord);

          if (!Number.isFinite(x) || !Number.isFinite(y)) {
            skippedNoCoords++;
            return;
          }

          const coords = lksToWgs(x, y);
          const lat = coords[0];
          const lon = coords[1];

          if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
            skippedNoCoords++;
            return;
          }

          prepared.push({
            objectId: a.OBJECTID,
            redmine: redmineIssue(a.redmine_url),
            adresas: normalizeText(a.adresas),
            typeText: getTypeText(a.tvark_tipas_name),
            typeKey: getTypeText(a.tvark_tipas_name),
            statusText: getStatusText(a.statusas_name),
            contractorText: getContractorText(a.rangovas),
            contractorKey: getContractorText(a.rangovas),
            lat: lat,
            lon: lon
          });
        });

        assignContractorColors(
          prepared.map(function (p) { return p.contractorKey; })
        );

        prepared.forEach(function (p) {
          p.contractorColor = getContractorColor(p.contractorKey);

          /* L.marker su divIcon, nes markercluster nepalaiko L.circleMarker.
             Vaizdas toks pat: uzpildytas skritulys be konturo.
             idvColor perduodamas spieciaus spalvai nustatyti. */
          const layer = L.marker([p.lat, p.lon], {
            icon: dotIcon(p.contractorColor),
            idvColor: p.contractorColor,
            keyboard: false
          });

          const row = document.createElement("div");
          row.className = "feature-row";
          row.tabIndex = 0;
          row.style.setProperty("--company-color", p.contractorColor);
          row.innerHTML =
            '<div class="row-top">' +
              '<span class="row-title">' + esc(p.adresas || "Adresas nenurodytas") + "</span>" +
              '<span class="row-geom">' + esc(p.typeText) + "</span>" +
            "</div>" +
            '<div class="row-line">' +
              '<span class="dot fill" style="background:' + esc(p.contractorColor) + '"></span>' +
              esc(p.contractorText) +
            "</div>" +
            '<div class="row-coords">' +
              (p.redmine && p.redmine.id
                ? '<span class="row-issue">#' + esc(p.redmine.id) + "</span>"
                : "") +
              p.lat.toFixed(5) + ", " + p.lon.toFixed(5) +
            "</div>";

          const item = Object.assign({}, p, { layer: layer, rowEl: row });

          item.searchText =
            (p.adresas || "") + " " + p.contractorText + " " +
            p.typeText + " " + p.statusText + " " + (p.objectId || "") + " " +
            (p.redmine && p.redmine.id ? p.redmine.id : "");

          layer.bindPopup(itemPopupHtml(item));

          layer.on("click", function () {
            clearActiveRows();
            row.classList.add("active");
            row.scrollIntoView({ behavior: "smooth", block: "center" });
          });

          row.onclick = function () {
            focusItem(item);
          };

          row.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              focusItem(item);
            }
          });

          allItems.push(item);
        });

        console.log("Suvestinė:", {
          gautaIsServiso: features.length,
          prideta: allItems.length,
          skippedNoCoords: skippedNoCoords
        });

        /* Pagal numatyma ijungiami visi tipai ir rangovai:
           statuso filtras jau pritaikytas serverio puseje. */
        selectedTypes = new Set(allItems.map(function (item) { return item.typeKey; }));
        selectedContractors = new Set(allItems.map(function (item) { return item.contractorKey; }));

        buildTypeFilters();
        buildContractorFilters();
        applyFilter();

        if (featureLayer.getLayers().length) {
          const bounds = featureLayer.getBounds();

          if (bounds.isValid()) {
            map.fitBounds(bounds.pad(0.08));
          }
        }

        finishProgress("done");

        if (skippedNoCoords > 0) {
          console.warn("Įrašų be tinkamų X_koord/Y_koord: " + skippedNoCoords);
        }

        if (!allItems.length) {
          setStatus(
            "Servisas grąžino <span class=\"num\">" + features.length +
            "</span> įrašų, bet nė vienas neturi tinkamų koordinačių",
            true
          );
        }
      } catch (e) {
        console.error("Bendra klaida loadData():", e);

        finishProgress("error");
        setCounts(0);
        renderList([]);
        setStatus("Nepavyko įkelti duomenų. " + esc(e.message), true);
      }
    }

    loadData();
  </script>
</body>
</html>
