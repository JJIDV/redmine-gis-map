<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projektų geometrija pagal įmones</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/proj4@2.9.1/dist/proj4.js"></script>

  <style>
    /* ===== ID Vilnius tokenai ===== */
    :root {
      --navy: #021d44;
      --navy-900: #011430;
      --royal: #002f77;
      --sky: #00b7f4;
      --green: #2aa00c;
      --silver: #bec7cc;
      --muted: #67778f;
      --muted-hi: #9aa5b4;
      --danger: #ff6b6b;

      --line: rgba(255, 255, 255, 0.10);
      --line-hi: rgba(255, 255, 255, 0.20);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-hi: rgba(255, 255, 255, 0.12);

      --font-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

      --panel-w: 304px;
      --handle-h: 46px;

      /* Fonas po plytelemis, kad kraunantis nemirgetu balti tarpai */
      --map-bg: #f2f2f0;
    }

    [data-basemap="dark"] {
      --map-bg: #101418;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: var(--font-ui);
      background: var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    #map {
      flex: 1;
      min-width: 0;
      background: var(--map-bg);
    }

    /* ===== Panele ===== */
    #panel {
      flex: 0 0 var(--panel-w);
      max-width: var(--panel-w);
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #021d44 0%, #011430 100%);
      color: #fff;
      border-left: 1px solid var(--line);
    }

    /* Ikelimo eigos begis */
    #rail {
      height: 2px;
      flex: 0 0 2px;
      background: var(--line);
      overflow: hidden;
    }

    #rail-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--sky), var(--green));
      transition: width 0.25s ease, opacity 0.4s ease 0.3s;
    }

    #rail[data-state="done"] #rail-fill { opacity: 0; }
    #rail[data-state="error"] #rail-fill { width: 100%; background: var(--danger); opacity: 1; }

    /* ===== Antraste ===== */
    #panel-head {
      flex: 0 0 auto;
      border-bottom: 1px solid var(--line);
    }

    #panel-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 12px 14px;
    }

    #panel-title .name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .count {
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--sky);
      margin-left: auto;
    }

    #sheet-handle {
      display: none;
      width: 100%;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: var(--handle-h);
      background: none;
      border: 0;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    #sheet-grip {
      width: 26px;
      height: 3px;
      border-radius: 999px;
      background: var(--line-hi);
      flex: 0 0 auto;
    }

    #sheet-handle:hover #sheet-grip { background: var(--sky); }

    /* ===== Kunas ===== */
    #panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #filter {
      flex: 0 0 auto;
      margin: 12px 14px 4px;
      padding: 8px 10px;
      width: calc(100% - 28px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }

    #filter::placeholder { color: var(--muted); }

    #filter:focus-visible {
      border-color: var(--sky);
      box-shadow: 0 0 0 2px rgba(0, 183, 244, 0.28);
    }

    /* ===== Legenda kaip filtras ===== */
    #keys-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 4px;
    }

    #keys-bar .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-hi);
    }

    #keys-toggle {
      margin-left: auto;
      background: none;
      border: 0;
      color: var(--muted-hi);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    #keys-toggle:hover { color: #fff; background: var(--surface); }

    #keys {
      /* flex-shrink privalo buti 0, kitaip sarasas suspaudzia filtrus
         iki juosteles ir ju nebeimanoma isskleisti. */
      flex: 0 0 auto;
      max-height: 40vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 14px 8px;
    }

    #panel.keys-collapsed #keys { display: none; }

    .key-group + .key-group { margin-top: 10px; }

    .key-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 6px 0 6px;
    }

    .key-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .key-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .key-actions button {
      background: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted-hi);
      font-family: inherit;
      font-size: 10px;
      padding: 2px 7px;
      cursor: pointer;
    }

    .key-actions button:hover {
      color: #fff;
      border-color: var(--line-hi);
      background: var(--surface);
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px 4px 7px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    .pill:hover { background: var(--surface); color: var(--muted-hi); }

    .pill .dot { opacity: 0.45; }

    .pill[aria-pressed="true"] {
      background: var(--surface-hi);
      border-color: var(--line-hi);
      color: #fff;
    }

    .pill[aria-pressed="true"] .dot { opacity: 1; }

    .pill-count {
      font-family: var(--font-mono);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .pill[aria-pressed="true"] .pill-count { color: var(--sky); }

    /* Skrituliai: uzpildytas = statusas, konturinis = imone */
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .dot.ring {
      background: transparent;
      border: 2px solid currentColor;
    }

    /* ===== Sarasas ===== */
    #list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-top: 1px solid var(--line);
    }

    .feature-row {
      position: relative;
      padding: 8px 12px 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .feature-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--company-color, var(--muted));
    }

    .feature-row:hover { background: rgba(0, 183, 244, 0.08); }

    .feature-row.active { background: rgba(0, 183, 244, 0.16); }

    .feature-row.active::before { background: var(--sky); }

    .feature-row:focus-visible {
      outline: 2px solid var(--sky);
      outline-offset: -2px;
    }

    .row-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .row-id {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .row-geom {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .row-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted-hi);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Redmine uzduoties numeris saraso eiluteje.

       Rasomas su zodziu "Redmine", nes .row-id jau rodo #OBJECTID.
       Be zodzio eiluteje butu du skirtingi numeriai su grotelemis ir
       ju nebutu imanoma atskirti.

       Sky spalva cia nenaudojama samoningai - ji rezervuota tik tam,
       kas tikrai paspaudziama. */
    .row-issue {
      display: block;
      margin-top: 3px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }

    #list-empty {
      padding: 18px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted-hi);
    }

    #list-empty strong {
      display: block;
      color: #fff;
      font-weight: 600;
      margin-bottom: 3px;
    }

    /* ===== Slankikliai ===== */

    #list,
    #keys {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.20) transparent;
    }

    #list::-webkit-scrollbar,
    #keys::-webkit-scrollbar {
      width: 10px;
    }

    #list::-webkit-scrollbar-track,
    #keys::-webkit-scrollbar-track {
      background: transparent;
    }

    #list::-webkit-scrollbar-thumb,
    #keys::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }

    #list::-webkit-scrollbar-thumb:hover,
    #keys::-webkit-scrollbar-thumb:hover {
      background-color: rgba(0, 183, 244, 0.55);
    }

    /* Rodykles slankiklio galuose pasalinamos */
    #list::-webkit-scrollbar-button,
    #keys::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    #list::-webkit-scrollbar-corner,
    #keys::-webkit-scrollbar-corner {
      background: transparent;
    }

    /* ===== Poraste ===== */
    #status-bar {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      line-height: 1.45;
      color: var(--muted-hi);
      word-break: break-word;
    }

    #status-bar .num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    #status-bar.is-error {
      color: var(--danger);
      background: rgba(255, 107, 107, 0.08);
    }

    /* ===== Leaflet perdazymas ===== */
    .leaflet-container {
      font-family: var(--font-ui);
      background: var(--map-bg);
    }

    .leaflet-control-zoom a {
      background: #fff;
      color: var(--navy);
      border-color: var(--silver);
      font-weight: 600;
    }

    .leaflet-control-zoom a:hover { background: #f5f5f5; color: var(--royal); }

    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.86);
      color: #4a5568;
      font-size: 10px;
    }

    .leaflet-control-attribution a { color: var(--royal); }

    [data-basemap="dark"] .leaflet-control-zoom a {
      background: #1a2230;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.16);
    }

    [data-basemap="dark"] .leaflet-control-zoom a:hover {
      background: #24303f;
      color: var(--sky);
    }

    [data-basemap="dark"] .leaflet-control-attribution {
      background: rgba(10, 14, 20, 0.78);
      color: var(--muted-hi);
    }

    [data-basemap="dark"] .leaflet-control-attribution a { color: var(--sky); }

    .leaflet-popup-content-wrapper {
      background: var(--navy);
      color: #fff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(1, 20, 48, 0.35);
    }

    .leaflet-popup-tip { background: var(--navy); }

    .leaflet-popup-content {
      margin: 11px 13px;
      font-size: 12px;
      line-height: 1.55;
    }

    .leaflet-popup-close-button { color: var(--muted-hi) !important; }
    .leaflet-popup-close-button:hover { color: #fff !important; }

    .pop-id {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .pop-line {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted-hi);
    }

    .pop-line b {
      color: #fff;
      font-weight: 500;
    }

    .pop-pick-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-hi);
      margin-bottom: 4px;
    }

    .overlap-select-item {
      padding: 7px 4px;
      cursor: pointer;
      border-top: 1px solid var(--line);
    }

    .overlap-select-item:hover { background: var(--surface); }

    /* ===== Nuoroda i Redmine uzduoti popup viduje =====
       Selektorius su .leaflet-popup-content, nes Leaflet turi savo
       .leaflet-container a spalva, kuri kitaip nugaletu. */
    .leaflet-popup-content .pop-action {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      padding: 6px 11px;
      border-radius: 6px;
      background: rgba(0, 183, 244, 0.14);
      border: 1px solid rgba(0, 183, 244, 0.38);
      color: var(--sky);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .leaflet-popup-content .pop-action:hover,
    .leaflet-popup-content .pop-action:focus-visible {
      background: rgba(0, 183, 244, 0.26);
      border-color: var(--sky);
      color: #fff;
      outline: none;
    }

    .leaflet-popup-content .pop-action svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .pop-note {
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
    }

    /* ===== Kompaktinis rezimas: zemas iframe arba mobilus ===== */
    @media (max-width: 640px), (max-height: 520px) {
      #app {
        display: block;
        position: relative;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      #panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1100;
        flex: none;
        max-width: none;
        max-height: 78%;
        border-left: 0;
        border-top: 1px solid var(--line-hi);
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -10px 30px rgba(1, 20, 48, 0.40);
      }

      #rail { border-radius: 12px 12px 0 0; }

      #panel-head { border-bottom: 0; }
      #panel-title { display: none; }
      #sheet-handle { display: flex; }

      #panel-body { display: none; }
      #panel.open #panel-body { display: flex; }
      #panel.open #panel-head { border-bottom: 1px solid var(--line); }

      #panel:not(.open) #status-bar { display: none; }

      #keys { max-height: 32vh; }

      .leaflet-bottom.leaflet-right { bottom: calc(var(--handle-h) + 4px); }
    }

    /* ===== Platus ir zemas langas ==============================
       Kai aukstis yra 300 px arba maziau, o plotis didesnis negu 1200 px,
       apatinis lapas butu aukstesnis uz pati zemelapi, todel panele
       grazinama i desini sona.

       Blokas eina PO kompaktinio rezimo, todel esant vienodam
       specifiskumui laimi sios taisykles.
       ========================================================= */
    @media (min-width: 1201px) and (max-height: 300px) {
      #app {
        display: flex;
        position: static;
      }

      #map {
        position: static;
        inset: auto;
        flex: 1;
        min-width: 0;
      }

      #panel {
        /* Esant tokiam plociui panele gali buti kiek platesne, kad
           statusu ir imoniu pavadinimai reciau luztu i dvi eilutes. */
        --panel-w: 330px;

        position: static;
        flex: 0 0 var(--panel-w);
        max-width: var(--panel-w);
        max-height: none;
        z-index: auto;
        border-left: 1px solid var(--line);
        border-top: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #rail { border-radius: 0; }

      #panel-head { border-bottom: 1px solid var(--line); }
      #panel-title { display: flex; padding: 9px 14px; }
      #sheet-handle { display: none; }

      #panel-body { display: flex; }
      #panel:not(.open) #status-bar { display: block; }

      #filter { margin: 9px 14px 4px; }
      #keys-bar { padding: 6px 14px 4px; }

      /* Prie 300 px aukscio filtrams paliekama maziau vietos,
         kad sarasui liektu bent kelios eilutes. */
      #keys { max-height: 34vh; }

      .leaflet-bottom.leaflet-right { bottom: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="map"></div>

    <aside id="panel" class="keys-collapsed">
      <div id="rail"><div id="rail-fill"></div></div>

      <header id="panel-head">
        <button id="sheet-handle" type="button" aria-expanded="false" aria-controls="panel-body">
          <span id="sheet-grip"></span>
          <span id="sheet-label">Objektų sąrašas</span>
          <span id="count-compact" class="count">–</span>
        </button>

        <div id="panel-title">
          <span class="name">Projektai pagal įmones</span>
          <span id="count-wide" class="count">–</span>
        </div>
      </header>

      <div id="panel-body">
        <input
          id="filter"
          type="text"
          placeholder="Ieškoti pagal ID, įmonę ar statusą"
          aria-label="Ieškoti objektų"
        />

        <div id="keys-bar">
          <span class="label">Ką rodyti</span>
          <button id="keys-toggle" type="button" aria-expanded="false" aria-controls="keys">
            Rodyti filtrus
          </button>
        </div>

        <div id="keys">
          <div class="key-group" id="status-group"></div>
          <div class="key-group" id="company-group"></div>
        </div>

        <div id="list"></div>
      </div>

      <footer id="status-bar">Kraunami duomenys</footer>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* =========================================================
       KONFIGURACIJA
       ========================================================= */
    const arcgisLayerUrl =
      "https://opencity.idvilnius.lt/atviras/rest/services/Eismo_valdymas/EOP_uzduociu_geometrija/FeatureServer/3";

    const ENVIRONMENT_FIELD = "Aplinka";

    /* 2 = Produkcine. Anksciau buvo 1 = Testine.
       Reiksme naudojama ir serverio uzklausoje, ir porastes tekste,
       todel keiciama tik cia. */
    const ENVIRONMENT_VALUE = "1";

    /* Rodomos tik tos uzduotys, kurios jau turi Redmine nuoroda. */
    const REQUIRE_REDMINE = true;

    const STATUS_FIELD = "Statusas";
    const COMPANY_FIELD = "Imone";

    const EXCLUDED_STATUS_CODES = ["0"];

    /* =========================================================
       REDMINE NUORODA

       Lauko pavadinimas servise. Jeigu jis pasikeistu, uztenka pakeisti
       sia viena eilute.

       Reiksme skaitoma atspariai: pirma ieskoma tikslaus rakto, po to
       nepaisant raidziu dydzio. Jeigu lauko nera visai, konsoleje
       vienakart parasoma, kokie laukai realiai atejo is serviso, todel
       tylaus luzio nebus.

       Laukas gali tureti arba tik uzduoties numeri, pvz. 4159, arba
       pilna adresa. Abu atvejai apdorojami.
       ========================================================= */
    const REDMINE_FIELD = "redmineIssueID";

    const REDMINE_ISSUE_BASE = "https://redmine-test.idvilnius.lt/issues/";

    /* "_blank" atidaro nauja skirtuka, o zemelapis lieka atidarytas.
       "_top" perkelia visa narsykles skirtuka - tai naudinga, kai
       zemelapis iterptas per {{iframe(...)}} ir norima iseiti is iframe. */
    const REDMINE_LINK_TARGET = "_blank";

    const LABEL_OPEN_ISSUE = "Atverti užduotį";

    const STATUS_DOMAIN = [
      { name: "Vykdoma", code: "1" },
      { name: "Atlikta UVS", code: "4" },
      { name: "Atšaukta UVS", code: "5" },
      { name: "Sukurta UVS", code: "6" },
      { name: "Atšaukta EOP", code: "7" },
      { name: "Patvirtinta ir uždaryta", code: "2" }
    ];

    const DEFAULT_VISIBLE_STATUSES = ["1", "4", "5", "6"];

    const statusLookup = STATUS_DOMAIN.reduce(function (acc, item) {
      acc[String(item.code)] = item.name;
      return acc;
    }, {});

    const statusFillColors = {
      "1": "#f59e0b",
      "2": "#166534",
      "4": "#86efac",
      "5": "#dc2626",
      "6": "#facc15",
      "7": "#dc2626"
    };

    const companyLookup = {
      0: "Nenurodyta",
      1: "VMSA",
      2: "SISP",
      3: "VVT",
      4: "Grinda",
      5: "Biseris",
      6: "Maniga",
      7: "Gatas"
    };

    const companyStrokeColors = {
      0: "#6b7280",
      1: "#1f78b4",
      2: "#33a02c",
      3: "#e31a1c",
      4: "#ff7f00",
      5: "#6a3d9a",
      6: "#b15928",
      7: "#17a2b8"
    };

    const environmentLookup = {
      1: "Testinė",
      2: "Produkcinė"
    };

    proj4.defs(
      "EPSG:3346",
      "+proj=tmerc +lat_0=0 +lon_0=24 +k=0.9998 +x_0=500000 +y_0=0 +ellps=GRS80 +units=m +no_defs"
    );

    /* =========================================================
       PAGALBINES FUNKCIJOS
       ========================================================= */
    function esc(value) {
      return String(value === null || value === undefined ? "" : value).replace(
        /[&<>"']/g,
        function (ch) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[ch];
        }
      );
    }

    function normalizeCode(value) {
      if (value === null || value === undefined || value === "") return "__EMPTY__";
      return String(value);
    }

    function normalizeText(value) {
      if (value === null || value === undefined) return "";
      return String(value).trim();
    }

    /* ===== Redmine lauko skaitymas ===== */

    /* Ispejimas rodomas tik viena karta, kad konsole neuzsiverstu
       vienodais pranesimais prie keliu simtu objektu. */
    let redmineFieldWarned = false;

    function readRedmineRaw(attrs) {
      if (!attrs) return null;

      if (Object.prototype.hasOwnProperty.call(attrs, REDMINE_FIELD)) {
        return attrs[REDMINE_FIELD];
      }

      /* Atsarginis kelias: ArcGIS lauko pavadinimas gali skirtis raidziu
         dydziu nuo to, kuris nurodytas konfiguracijoje. */
      const wanted = String(REDMINE_FIELD).toLowerCase();
      const keys = Object.keys(attrs);

      for (let i = 0; i < keys.length; i++) {
        if (keys[i].toLowerCase() === wanted) return attrs[keys[i]];
      }

      if (!redmineFieldWarned) {
        redmineFieldWarned = true;
        console.warn(
          '[eop] lauko "' + REDMINE_FIELD + '" servise nera. Gauti laukai: ' +
          keys.join(", ") + ". Redmine nuoroda popup lange nerodoma."
        );
      }

      return null;
    }

    /* Grazina { id, url } arba null.

       Apdorojami trys atvejai:
         - tuscias arba NULL           -> null
         - pilnas adresas su http      -> naudojamas kaip yra
         - numeris, galimai su tarpais -> paliekami tik skaitmenys

       Skaitmenu filtras yra svarbus: be jo tarpas arba bruksnelis
       patektu i adresa ir nuoroda nuluztu. */
    function redmineIssue(rawValue) {
      const text = normalizeText(rawValue);
      if (!text) return null;

      if (/^https?:\/\//i.test(text)) {
        const fromUrl = text.match(/\/issues\/(\d+)/);
        return { id: fromUrl ? fromUrl[1] : null, url: text };
      }

      const digits = text.replace(/\D+/g, "");
      if (!digits) return null;

      return { id: digits, url: REDMINE_ISSUE_BASE + digits };
    }

    /* Isorines nuorodos ikona ta pacia linijine maniera kaip zemelapio smeigtukas */
    function externalLinkSvg() {
      return (
        '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path d="M14 4h6v6"/>' +
        '<path d="M20 4l-8.5 8.5"/>' +
        '<path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7.5A1.5 1.5 0 0 1 5 6h4.5"/>' +
        "</svg>"
      );
    }

    function isExcludedStatus(statusKey) {
      return EXCLUDED_STATUS_CODES.includes(String(statusKey));
    }

    function getStatusText(value) {
      const key = normalizeCode(value);
      if (key === "__EMPTY__") return "Nenurodytas statusas";
      return statusLookup[key] || ("Nežinomas statusas (" + key + ")");
    }

    function getStatusFillColor(value) {
      const key = normalizeCode(value);
      return statusFillColors[key] || "#d1d5db";
    }

    function getCompanyText(code) {
      const key = normalizeCode(code);
      if (key === "__EMPTY__") return "Nenurodyta";
      return companyLookup[key] || ("Įmonės kodas: " + key);
    }

    function getCompanyStrokeColor(code) {
      const key = normalizeCode(code);
      if (key === "__EMPTY__") return companyStrokeColors[0];
      return companyStrokeColors[key] || "#374151";
    }

    function getEnvironmentText(code) {
      const key = normalizeCode(code);
      if (key === "__EMPTY__") return "Nenurodyta";
      return environmentLookup[key] || ("Aplinkos kodas: " + key);
    }

    function getGeometryTypeLabel(geometry) {
      if (!geometry) return "Nėra geometrijos";
      if (Array.isArray(geometry.rings)) return "Poligonas";
      if (Array.isArray(geometry.paths)) return "Linija";
      if (typeof geometry.x === "number" && typeof geometry.y === "number") return "Taškas";
      return "Nežinoma geometrija";
    }

    function lksToWgs(x, y) {
      const result = proj4("EPSG:3346", "EPSG:4326", [x, y]);
      return [result[1], result[0]];
    }

    function polygonToLatLngs(geometry) {
      if (!geometry || !Array.isArray(geometry.rings)) return [];

      return geometry.rings
        .map(function (ring) {
          return ring
            .filter(function (pt) {
              return Array.isArray(pt) && pt.length >= 2;
            })
            .map(function (pt) {
              return lksToWgs(pt[0], pt[1]);
            });
        })
        .filter(function (ring) {
          return ring.length;
        });
    }

    function polylineToLatLngs(geometry) {
      if (!geometry || !Array.isArray(geometry.paths)) return [];

      return geometry.paths
        .map(function (path) {
          return path
            .filter(function (pt) {
              return Array.isArray(pt) && pt.length >= 2;
            })
            .map(function (pt) {
              return lksToWgs(pt[0], pt[1]);
            });
        })
        .filter(function (path) {
          return path.length;
        });
    }

    function pointToLatLng(geometry) {
      if (!geometry || typeof geometry.x !== "number" || typeof geometry.y !== "number") {
        return null;
      }

      return lksToWgs(geometry.x, geometry.y);
    }

    function getGeometryCenter(geometry) {
      if (!geometry) return null;

      try {
        if (Array.isArray(geometry.rings)) {
          const latLngs = polygonToLatLngs(geometry);
          if (!latLngs.length) return null;

          const polygon = L.polygon(latLngs);
          const bounds = polygon.getBounds();

          return bounds.isValid() ? bounds.getCenter() : null;
        }

        if (Array.isArray(geometry.paths)) {
          const latLngs = polylineToLatLngs(geometry);
          if (!latLngs.length) return null;

          const polyline = L.polyline(latLngs);
          const bounds = polyline.getBounds();

          return bounds.isValid() ? bounds.getCenter() : null;
        }

        if (typeof geometry.x === "number" && typeof geometry.y === "number") {
          const pt = pointToLatLng(geometry);
          return pt ? L.latLng(pt[0], pt[1]) : null;
        }
      } catch (err) {
        console.error("Klaida skaiciuojant geometrijos centra:", err, geometry);
      }

      return null;
    }

    function createLeafletLayer(geometry, companyCode, statusValue) {
      const strokeColor = getCompanyStrokeColor(companyCode);
      const fillColor = getStatusFillColor(statusValue);

      if (!geometry) return null;

      try {
        if (Array.isArray(geometry.rings)) {
          const latLngs = polygonToLatLngs(geometry);
          if (!latLngs.length) return null;

          return L.polygon(latLngs, {
            color: strokeColor,
            weight: 3,
            opacity: 1,
            fillColor: fillColor,
            fillOpacity: 0.45,
            interactive: false
          });
        }

        if (Array.isArray(geometry.paths)) {
          const latLngs = polylineToLatLngs(geometry);
          if (!latLngs.length) return null;

          return L.polyline(latLngs, {
            color: strokeColor,
            weight: 4,
            opacity: 0.95,
            interactive: false
          });
        }

        if (typeof geometry.x === "number" && typeof geometry.y === "number") {
          const latLng = pointToLatLng(geometry);
          if (!latLng) return null;

          return L.circleMarker(latLng, {
            radius: 7,
            color: strokeColor,
            weight: 3,
            fillColor: fillColor,
            fillOpacity: 0.9,
            interactive: false
          });
        }
      } catch (err) {
        console.error("Klaida kuriant Leaflet sluoksni:", err, geometry);
      }

      return null;
    }

    /* =========================================================
       BAZINIS ZEMELAPIS
       Visi variantai nemokami, be API rakto, teikiami per CDN.
       Perjungiama viena eilute: const BASEMAP = BASEMAPS.<vardas>;
       ========================================================= */
    const CARTO_ATTRIBUTION =
      '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ' +
      '© <a href="https://carto.com/attributions">CARTO</a>';

    const BASEMAPS = {
      positron: {
        tone: "light",
        url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      },
      positronNoLabels: {
        tone: "light",
        url: "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      },
      darkMatter: {
        tone: "dark",
        url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      },
      darkMatterNoLabels: {
        tone: "dark",
        url: "https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
        attribution: CARTO_ATTRIBUTION
      }
    };

    const BASEMAP = BASEMAPS.positron;

    document.documentElement.setAttribute("data-basemap", BASEMAP.tone);

    const map = L.map("map", { zoomControl: true }).setView([54.6872, 25.2797], 11);

    L.tileLayer(BASEMAP.url, {
      subdomains: "abcd",
      maxZoom: 20,
      detectRetina: true,
      crossOrigin: true,
      attribution: BASEMAP.attribution
    }).addTo(map);

    /* ===== DOM ===== */
    const panelEl = document.getElementById("panel");
    const listEl = document.getElementById("list");
    const filterInput = document.getElementById("filter");
    const statusGroupEl = document.getElementById("status-group");
    const companyGroupEl = document.getElementById("company-group");
    const keysToggle = document.getElementById("keys-toggle");
    const sheetHandle = document.getElementById("sheet-handle");
    const sheetLabel = document.getElementById("sheet-label");
    const statusBar = document.getElementById("status-bar");
    const countWide = document.getElementById("count-wide");
    const countCompact = document.getElementById("count-compact");
    const railEl = document.getElementById("rail");
    const railFill = document.getElementById("rail-fill");

    let allItems = [];
    let featureLayer = L.featureGroup().addTo(map);
    let selectedStatuses = new Set(DEFAULT_VISIBLE_STATUSES);
    let selectedCompanies = new Set();
    let statusKeys = [];
    let companyKeys = [];

    /* Panele kompaktiniame rezime yra virs zemelapio, todel paspaudimai
       ir slinkimas neturi patekti i map.on("click") apdorojima. */
    L.DomEvent.disableClickPropagation(panelEl);
    L.DomEvent.disableScrollPropagation(panelEl);

    function refreshMapSize() {
      setTimeout(function () {
        map.invalidateSize();
      }, 60);
    }

    /* ===== Eigos begis ===== */
    function setProgress(loaded, total) {
      railEl.removeAttribute("data-state");
      const pct = total > 0 ? Math.round((loaded / total) * 100) : 0;
      railFill.style.width = pct + "%";
    }

    function finishProgress(state) {
      railFill.style.width = "100%";
      railEl.setAttribute("data-state", state);
    }

    /* ===== Busenos tekstas ===== */
    function setStatus(html, isError) {
      statusBar.innerHTML = html;
      statusBar.classList.toggle("is-error", !!isError);
    }

    function setCounts(shown) {
      const text = String(shown);
      countWide.textContent = text;
      countCompact.textContent = text;
    }

    /* =========================================================
       UZKLAUSOS
       ========================================================= */
    function queryUrl(params) {
      const url =
        arcgisLayerUrl.replace(/\/+$/, "") + "/query?" + new URLSearchParams(params).toString();
      console.log("Query URL:", url);
      return url;
    }

    async function fetchQuery(params) {
      const resp = await fetch(queryUrl(params), {
        cache: "no-store",
        mode: "cors"
      });

      const data = await resp.json();

      if (data.error) {
        throw new Error(
          (data.error.message || "ArcGIS query klaida") +
            (data.error.details && data.error.details.length
              ? " | " + data.error.details.join(" | ")
              : "")
        );
      }

      return data;
    }

    /* Filtras taikomas SERVERIO puseje, todel per tinkla keliauja tik
       reikalingi irasai.

       Redmine salyga atskirta nuo aplinkos salygos samoningai. Jeigu
       laukas servise dar nepaskelbtas, ArcGIS grazintu klaida ir
       zemelapis liktu tuscias. Todel pirmas bandymas su ja, o nepavykus -
       be jos, ir tada Redmine filtras pritaikomas narsykleje. */
    let redmineFilterServerSide = true;

    function buildWhere(includeRedmine) {
      /* Aplinka yra esriFieldTypeSmallInteger, todel be kabuciu. */
      const parts = [ENVIRONMENT_FIELD + " = " + ENVIRONMENT_VALUE];

      if (includeRedmine && REQUIRE_REDMINE) {
        /* IS NOT NULL veikia nepriklausomai nuo lauko tipo.

           Tuscia eilute cia NETIKRINAMA samoningai: jeigu laukas butu
           skaitinis, palyginimas su tuscia eilute butu SQL klaida.
           Tuscias reiksmes atmeta redmineIssue() narsykleje. */
        parts.push(REDMINE_FIELD + " IS NOT NULL");
      }

      return parts.join(" AND ");
    }

    async function fetchByObjectIds(where) {
      const idsData = await fetchQuery({
        where: where,
        returnIdsOnly: "true",
        f: "json"
      });

      const objectIds = idsData.objectIds || [];

      if (!objectIds.length) return [];

      const features = [];
      const chunkSize = 150;

      for (let i = 0; i < objectIds.length; i += chunkSize) {
        const chunk = objectIds.slice(i, i + chunkSize);

        /* outFields yra "*", todel naujai i servisa pridetas laukas
           atkeliauja automatiskai, be kodo pakeitimu. */
        const data = await fetchQuery({
          objectIds: chunk.join(","),
          outFields: "*",
          returnGeometry: "true",
          f: "json"
        });

        if (data.features && data.features.length) {
          features.push.apply(features, data.features);
        }

        setProgress(Math.min(i + chunkSize, objectIds.length), objectIds.length);
      }

      return features;
    }

    async function fetchAllFeatures() {
      try {
        return await fetchByObjectIds(buildWhere(true));
      } catch (e) {
        redmineFilterServerSide = false;

        console.warn(
          "[eop] uzklausa su salyga " + REDMINE_FIELD + " IS NOT NULL nepavyko: " +
          (e && e.message ? e.message : e) +
          ". Kraunama tik pagal aplinka, Redmine filtras taikomas narsykleje."
        );

        const data = await fetchQuery({
          where: buildWhere(false),
          outFields: "*",
          returnGeometry: "true",
          f: "json"
        });

        return data.features || [];
      }
    }

    /* =========================================================
       SARASAS IR FILTRAI
       ========================================================= */
    function clearActiveRows() {
      document.querySelectorAll(".feature-row.active").forEach(function (el) {
        el.classList.remove("active");
      });
    }

    function renderList(items) {
      listEl.innerHTML = "";

      if (!items.length) {
        const empty = document.createElement("div");
        empty.id = "list-empty";
        empty.innerHTML =
          "<strong>Nieko nerodoma</strong>" +
          "Įjunkite bent vieną statusą ir įmonę arba išvalykite paieškos tekstą.";
        listEl.appendChild(empty);
        return;
      }

      items.forEach(function (item) {
        listEl.appendChild(item.rowEl);
      });
    }

    function getVisibleItems() {
      const q = filterInput.value.trim().toLowerCase();

      return allItems.filter(function (item) {
        if (!selectedStatuses.has(item.statusKey)) return false;
        if (!selectedCompanies.has(item.companyKey)) return false;
        if (!q) return true;

        return (item.searchText || "").toLowerCase().includes(q);
      });
    }

    function applyFilter() {
      featureLayer.clearLayers();

      const visibleItems = getVisibleItems();

      visibleItems.forEach(function (item) {
        item.layer.addTo(featureLayer);
      });

      renderList(visibleItems);
      setCounts(visibleItems.length);

      const envText = getEnvironmentText(ENVIRONMENT_VALUE).toLowerCase();

      setStatus(
        '<span class="num">' + visibleItems.length + "</span> iš " +
          '<span class="num">' + allItems.length + "</span> objektų · " +
          esc(envText) + " aplinka" +
          (REQUIRE_REDMINE ? " · tik su Redmine užduotimi" : "")
      );

      sheetLabel.textContent = visibleItems.length ? "Objektų sąrašas" : "Nieko nerodoma";
    }

    function makePill(swatchClass, color, name, count, isOn, onToggle) {
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "pill";
      pill.setAttribute("aria-pressed", isOn ? "true" : "false");

      const dot = document.createElement("span");
      dot.className = "dot " + swatchClass;

      if (swatchClass === "ring") {
        dot.style.color = color;
      } else {
        dot.style.background = color;
      }

      const nameEl = document.createElement("span");
      nameEl.className = "pill-name";
      nameEl.textContent = name;

      const countEl = document.createElement("span");
      countEl.className = "pill-count";
      countEl.textContent = count;

      pill.appendChild(dot);
      pill.appendChild(nameEl);
      pill.appendChild(countEl);

      pill.addEventListener("click", function () {
        const next = pill.getAttribute("aria-pressed") !== "true";
        pill.setAttribute("aria-pressed", next ? "true" : "false");
        onToggle(next);
        applyFilter();
      });

      return pill;
    }

    function makeGroup(container, title, actions) {
      container.innerHTML = "";

      const head = document.createElement("div");
      head.className = "key-head";

      const titleEl = document.createElement("span");
      titleEl.className = "key-title";
      titleEl.textContent = title;
      head.appendChild(titleEl);

      const actionsEl = document.createElement("div");
      actionsEl.className = "key-actions";

      actions.forEach(function (action) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = action.label;
        btn.addEventListener("click", action.run);
        actionsEl.appendChild(btn);
      });

      head.appendChild(actionsEl);
      container.appendChild(head);

      const pills = document.createElement("div");
      pills.className = "pills";
      container.appendChild(pills);

      return pills;
    }

    function countBy(getKey) {
      const counts = {};
      const order = [];

      allItems.forEach(function (item) {
        const key = getKey(item);

        if (counts[key] === undefined) {
          counts[key] = 0;
          order.push(key);
        }

        counts[key]++;
      });

      return { counts: counts, keys: order };
    }

    function buildStatusFilters() {
      const result = countBy(function (item) {
        return item.statusKey;
      });

      statusKeys = result.keys.slice();

      statusKeys.sort(function (a, b) {
        const orderA = STATUS_DOMAIN.findIndex(function (s) {
          return String(s.code) === String(a);
        });

        const orderB = STATUS_DOMAIN.findIndex(function (s) {
          return String(s.code) === String(b);
        });

        if (orderA === -1 && orderB === -1) {
          return String(a).localeCompare(String(b), "lt");
        }

        if (orderA === -1) return 1;
        if (orderB === -1) return -1;

        return orderA - orderB;
      });

      const pills = makeGroup(statusGroupEl, "Statusas", [
        {
          label: "Numatyta",
          run: function () {
            selectedStatuses = new Set(DEFAULT_VISIBLE_STATUSES);
            buildStatusFilters();
            applyFilter();
          }
        },
        {
          label: "Visi",
          run: function () {
            selectedStatuses = new Set(statusKeys);
            buildStatusFilters();
            applyFilter();
          }
        },
        {
          label: "Nė vieno",
          run: function () {
            selectedStatuses = new Set();
            buildStatusFilters();
            applyFilter();
          }
        }
      ]);

      if (!statusKeys.length) {
        const note = document.createElement("div");
        note.className = "pill-count";
        note.textContent = "Statusų nerasta";
        pills.appendChild(note);
        return;
      }

      statusKeys.forEach(function (key) {
        pills.appendChild(
          makePill(
            "fill",
            getStatusFillColor(key),
            getStatusText(key),
            result.counts[key],
            selectedStatuses.has(key),
            function (isOn) {
              if (isOn) {
                selectedStatuses.add(key);
              } else {
                selectedStatuses.delete(key);
              }
            }
          )
        );
      });
    }

    function buildCompanyFilters() {
      const result = countBy(function (item) {
        return item.companyKey;
      });

      companyKeys = result.keys.slice();

      companyKeys.sort(function (a, b) {
        const numA = Number(a);
        const numB = Number(b);

        if (Number.isFinite(numA) && Number.isFinite(numB)) return numA - numB;

        return String(a).localeCompare(String(b), "lt");
      });

      const pills = makeGroup(companyGroupEl, "Įmonė", [
        {
          label: "Visos",
          run: function () {
            selectedCompanies = new Set(companyKeys);
            buildCompanyFilters();
            applyFilter();
          }
        },
        {
          label: "Nė vienos",
          run: function () {
            selectedCompanies = new Set();
            buildCompanyFilters();
            applyFilter();
          }
        }
      ]);

      if (!companyKeys.length) {
        const note = document.createElement("div");
        note.className = "pill-count";
        note.textContent = "Įmonių nerasta";
        pills.appendChild(note);
        return;
      }

      companyKeys.forEach(function (key) {
        pills.appendChild(
          makePill(
            "ring",
            getCompanyStrokeColor(key),
            getCompanyText(key),
            result.counts[key],
            selectedCompanies.has(key),
            function (isOn) {
              if (isOn) {
                selectedCompanies.add(key);
              } else {
                selectedCompanies.delete(key);
              }
            }
          )
        );
      });
    }

    /* =========================================================
       PAZYMEJIMAS ZEMELAPYJE
       ========================================================= */
    function pointInPolygon(point, polygonPoints) {
      let inside = false;

      for (let i = 0, j = polygonPoints.length - 1; i < polygonPoints.length; j = i++) {
        const xi = polygonPoints[i].x;
        const yi = polygonPoints[i].y;
        const xj = polygonPoints[j].x;
        const yj = polygonPoints[j].y;

        const intersect =
          yi > point.y !== yj > point.y &&
          point.x < ((xj - xi) * (point.y - yi)) / (yj - yi) + xi;

        if (intersect) inside = !inside;
      }

      return inside;
    }

    function distanceToSegment(p, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;

      if (dx === 0 && dy === 0) return p.distanceTo(a);

      const t = Math.max(
        0,
        Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy))
      );

      return p.distanceTo(L.point(a.x + t * dx, a.y + t * dy));
    }

    function itemContainsClick(item, latlng) {
      const geom = item.geometry;
      if (!geom) return false;

      const clickPoint = map.latLngToLayerPoint(latlng);

      if (Array.isArray(geom.rings)) {
        const rings = polygonToLatLngs(geom);

        return rings.some(function (ring) {
          const points = ring.map(function (ll) {
            return map.latLngToLayerPoint(L.latLng(ll[0], ll[1]));
          });

          return pointInPolygon(clickPoint, points);
        });
      }

      if (Array.isArray(geom.paths)) {
        const paths = polylineToLatLngs(geom);
        const tolerance = 8;

        return paths.some(function (path) {
          const points = path.map(function (ll) {
            return map.latLngToLayerPoint(L.latLng(ll[0], ll[1]));
          });

          for (let i = 1; i < points.length; i++) {
            if (distanceToSegment(clickPoint, points[i - 1], points[i]) <= tolerance) {
              return true;
            }
          }

          return false;
        });
      }

      if (typeof geom.x === "number" && typeof geom.y === "number") {
        const pt = pointToLatLng(geom);
        if (!pt) return false;

        const markerPoint = map.latLngToLayerPoint(L.latLng(pt[0], pt[1]));
        return clickPoint.distanceTo(markerPoint) <= 10;
      }

      return false;
    }

    /* Mygtukas i Redmine uzduoti. Jeigu nuorodos nera, rodomas
       paaiskinimas, o ne tuscia vieta - taip aisku, kad tai duomenu,
       o ne sasajos trukumas. */
    function popupActionHtml(item) {
      if (!item.redmine) {
        return '<div class="pop-note">Redmine užduotis nenurodyta</div>';
      }

      /* Uzduoties numeris paliekamas title atribute: pasiekiamas
         uzvedus, bet mygtuko teksto neapkrauna. */
      const hint = item.redmine.id ? ' title="#' + esc(item.redmine.id) + '"' : "";

      return (
        '<a class="pop-action" href="' + esc(item.redmine.url) + '"' +
        ' target="' + esc(REDMINE_LINK_TARGET) + '"' +
        ' rel="noopener noreferrer"' + hint + ">" +
        externalLinkSvg() +
        "<span>" + LABEL_OPEN_ISSUE + "</span>" +
        "</a>"
      );
    }

    function itemPopupHtml(item) {
      return (
        '<div class="pop-id">#' + esc(item.objectId) + "</div>" +
        '<div class="pop-line">' +
          '<span class="dot ring" style="color:' + esc(getCompanyStrokeColor(item.companyCode)) + '"></span>' +
          "<b>" + esc(item.companyText) + "</b>" +
        "</div>" +
        '<div class="pop-line">' +
          '<span class="dot fill" style="background:' + esc(getStatusFillColor(item.statusValue)) + '"></span>' +
          esc(item.statusText) +
        "</div>" +
        '<div class="pop-line">' + esc(item.geometryTypeText) +
          " · " + esc(item.environmentText) + " aplinka" +
        "</div>" +
        popupActionHtml(item)
      );
    }

    function selectItem(item, latlng) {
      clearActiveRows();

      if (item.rowEl) {
        item.rowEl.classList.add("active");
        item.rowEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      L.popup()
        .setLatLng(latlng || item.center)
        .setContent(itemPopupHtml(item))
        .openOn(map);
    }

    /* Persidengus keliems objektams pirma rodomas pasirinkimas.
       Redmine mygtukas cia nededamas samoningai: pasirinkus objekta
       atsidaro pilnas popup, kuriame mygtukas yra. Taip isvengiama
       kelio nuorodu viename mazame lange. */
    function showMultiSelectPopup(items, latlng) {
      const html =
        '<div style="min-width:210px">' +
          '<div class="pop-pick-title">Pasirinkite objektą</div>' +
          items
            .map(function (item, index) {
              return (
                '<div class="overlap-select-item" data-index="' + index + '">' +
                  '<div class="pop-id" style="border:0;padding:0;margin:0 0 3px">#' +
                    esc(item.objectId) +
                  "</div>" +
                  '<div class="pop-line">' +
                    '<span class="dot ring" style="color:' +
                      esc(getCompanyStrokeColor(item.companyCode)) + '"></span>' +
                    esc(item.companyText) +
                  "</div>" +
                  '<div class="pop-line">' +
                    '<span class="dot fill" style="background:' +
                      esc(getStatusFillColor(item.statusValue)) + '"></span>' +
                    esc(item.statusText) + " · " + esc(item.geometryTypeText) +
                  "</div>" +
                "</div>"
              );
            })
            .join("") +
        "</div>";

      const popup = L.popup().setLatLng(latlng).setContent(html).openOn(map);

      setTimeout(function () {
        document.querySelectorAll(".overlap-select-item").forEach(function (el) {
          el.addEventListener("click", function () {
            const index = Number(el.getAttribute("data-index"));
            const item = items[index];

            map.closePopup(popup);
            selectItem(item, latlng);
          });
        });
      }, 0);
    }

    map.on("click", function (e) {
      const visibleItems = getVisibleItems();

      const hits = visibleItems.filter(function (item) {
        return itemContainsClick(item, e.latlng);
      });

      if (!hits.length) return;

      if (hits.length === 1) {
        selectItem(hits[0], e.latlng);
        return;
      }

      showMultiSelectPopup(hits, e.latlng);
    });

    /* =========================================================
       PANELES VALDYMAS
       ========================================================= */
    sheetHandle.addEventListener("click", function () {
      const isOpen = panelEl.classList.toggle("open");
      sheetHandle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      refreshMapSize();
    });

    keysToggle.addEventListener("click", function () {
      const isCollapsed = panelEl.classList.toggle("keys-collapsed");
      keysToggle.textContent = isCollapsed ? "Rodyti filtrus" : "Slėpti filtrus";
      keysToggle.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
      refreshMapSize();
    });

    filterInput.addEventListener("input", applyFilter);

    /* =========================================================
       DUOMENU IKELIMAS
       ========================================================= */
    async function loadData() {
      try {
        setStatus("Kraunami duomenys");
        setCounts("–");
        setProgress(0, 1);

        featureLayer.clearLayers();
        allItems = [];
        listEl.innerHTML = "";
        statusGroupEl.innerHTML = "";
        companyGroupEl.innerHTML = "";
        redmineFieldWarned = false;

        const features = await fetchAllFeatures();

        console.log("Features kiekis:", features.length);

        if (!features.length) {
          finishProgress("error");
          setStatus("Servisas negrąžino nė vieno objekto", true);
          setCounts(0);
          renderList([]);
          return;
        }

        let skippedEnvironment = 0;
        let skippedExcludedStatus = 0;
        let skippedNoGeometry = 0;
        let skippedNoLayer = 0;
        let skippedNoCenter = 0;
        let skippedNoRedmine = 0;
        let withRedmine = 0;
        let addedCount = 0;

        features.forEach(function (f) {
          const attrs = f.attributes || {};
          const geom = f.geometry;

          const environmentKey = normalizeCode(attrs[ENVIRONMENT_FIELD]);
          if (environmentKey !== ENVIRONMENT_VALUE) {
            skippedEnvironment++;
            return;
          }

          const statusValue = attrs[STATUS_FIELD];
          const statusKey = normalizeCode(statusValue);

          if (isExcludedStatus(statusKey)) {
            skippedExcludedStatus++;
            return;
          }

          if (!geom) {
            skippedNoGeometry++;
            return;
          }

          const objectId =
            attrs.OBJECTID !== undefined && attrs.OBJECTID !== null
              ? attrs.OBJECTID
              : "(be ID)";

          const companyCode = attrs[COMPANY_FIELD];
          const companyKey = normalizeCode(companyCode);
          const environmentCode = attrs[ENVIRONMENT_FIELD];

          const companyText = getCompanyText(companyCode);
          const environmentText = getEnvironmentText(environmentCode);
          const statusText = getStatusText(statusValue);
          const geometryTypeText = getGeometryTypeLabel(geom);
          const companyColor = getCompanyStrokeColor(companyCode);
          const statusColor = getStatusFillColor(statusValue);

          const redmine = redmineIssue(readRedmineRaw(attrs));

          /* Patikrinimas atliekamas ir cia, ne tik serverio puseje.
             Taip atmetamos tuscios eilutes, kuriu IS NOT NULL nepagauna,
             ir veikia atsarginis kelias, kai serverio filtras nepavyko. */
          if (REQUIRE_REDMINE && !redmine) {
            skippedNoRedmine++;
            return;
          }

          if (redmine) withRedmine++;

          const layer = createLeafletLayer(geom, companyCode, statusValue);
          if (!layer) {
            skippedNoLayer++;
            return;
          }

          const center = getGeometryCenter(geom);
          if (!center) {
            skippedNoCenter++;
            return;
          }

          const row = document.createElement("div");
          row.className = "feature-row";
          row.tabIndex = 0;
          row.style.setProperty("--company-color", companyColor);
          row.innerHTML =
            '<div class="row-top">' +
              '<span class="row-id">#' + esc(objectId) + "</span>" +
              '<span class="row-geom">' + esc(geometryTypeText) + "</span>" +
            "</div>" +
            '<div class="row-line">' +
              '<span class="dot ring" style="color:' + esc(companyColor) + '"></span>' +
              esc(companyText) +
            "</div>" +
            '<div class="row-line">' +
              '<span class="dot fill" style="background:' + esc(statusColor) + '"></span>' +
              esc(statusText) +
            "</div>" +
            (redmine && redmine.id
              ? '<span class="row-issue">Redmine #' + esc(redmine.id) + "</span>"
              : "");

          const item = {
            objectId: objectId,
            companyCode: companyCode,
            companyKey: companyKey,
            environmentCode: environmentCode,
            statusValue: statusValue,
            statusKey: statusKey,
            companyText: companyText,
            environmentText: environmentText,
            statusText: statusText,
            geometryTypeText: geometryTypeText,
            geometry: geom,
            center: center,
            layer: layer,
            rowEl: row,
            redmine: redmine,
            searchText:
              objectId + " " + companyText + " " + environmentText + " " +
              statusText + " " + geometryTypeText + " " +
              (redmine && redmine.id ? redmine.id : "")
          };

          function focusItem() {
            try {
              if (layer.getBounds && typeof layer.getBounds === "function") {
                const bounds = layer.getBounds();

                if (bounds && bounds.isValid && bounds.isValid()) {
                  map.fitBounds(bounds.pad(0.2));
                } else {
                  map.setView(center, 16);
                }
              } else {
                map.setView(center, 16);
              }
            } catch (err) {
              map.setView(center, 16);
            }

            selectItem(item, center);
          }

          row.onclick = focusItem;

          row.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              focusItem();
            }
          });

          allItems.push(item);
          addedCount++;
        });

        console.log("Suvestine:", {
          gautaIsServiso: features.length,
          prideta: addedCount,
          suRedmineNuoroda: withRedmine,
          redmineFiltrasServeryje: redmineFilterServerSide,
          skippedNoRedmine: skippedNoRedmine,
          skippedEnvironment: skippedEnvironment,
          skippedExcludedStatus: skippedExcludedStatus,
          skippedNoGeometry: skippedNoGeometry,
          skippedNoLayer: skippedNoLayer,
          skippedNoCenter: skippedNoCenter
        });

        /* Imones pagal numatyma ijungtos visos, nes konturo spalva yra
           legendos dalis, o ne numatytasis filtras. */
        selectedCompanies = new Set(
          allItems.map(function (item) {
            return item.companyKey;
          })
        );

        buildStatusFilters();
        buildCompanyFilters();
        applyFilter();

        if (featureLayer.getLayers().length) {
          const bounds = featureLayer.getBounds();

          if (bounds.isValid()) {
            map.fitBounds(bounds.pad(0.08));
          }
        }

        finishProgress("done");

        if (!allItems.length) {
          setStatus(
            "Servisas grąžino <span class=\"num\">" + features.length +
              "</span> objektų, bet nė vienas neatitiko aplinkos ir statuso filtrų",
            true
          );
        }
      } catch (e) {
        console.error("Bendra klaida loadData():", e);

        finishProgress("error");
        setCounts(0);
        renderList([]);
        setStatus("Nepavyko įkelti duomenų. " + esc(e.message), true);
      }
    }

    loadData();
  </script>
